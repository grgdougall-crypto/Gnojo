{% extends "base.html" %}
{% block title %}{{ status }} | Gnojo{% endblock %}

{% block content %}
<div class="container py-5"><div class="error-page mx-auto text-center">
    <div class="error-page__mark"><img src="{{ url_for('static', filename='brand/gnojo-mark-reverse.svg') }}" alt=""></div>
    <p class="text-uppercase text-primary small fw-bold mb-2">Error {{ status }}</p>
    <h1 class="display-6 fw-bold">{{ title }}</h1>
    <p class="text-muted fs-5 mt-3">{{ message }}</p>
    <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
        <a class="btn btn-primary" href="{{ url_for('home') }}">Return home</a>
        <a class="btn btn-outline-primary" href="{{ url_for('workflow_studio') }}">Open Workflow Studio</a>
        <a class="btn btn-outline-secondary" href="{{ url_for('content_studio') }}">Open Content Studio</a>
    </div>
    <div class="error-page__request mt-4"><span>Request ID</span><code>{{ request_id }}</code></div>
</div></div>
{% endblock %}
