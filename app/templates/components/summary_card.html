<section class="border rounded p-4 mb-4">

    <div
        class="d-flex justify-content-between
               align-items-start gap-3 mb-3"
    >
        <div>
            <p
                class="text-uppercase text-muted
                       small fw-bold mb-1"
            >
                Core Content
            </p>

            <h3 class="h5 mb-0">
                Summary
            </h3>
        </div>

        {% if draft.summary %}
            <span class="badge text-bg-success">
                Complete
            </span>
        {% else %}
            <span class="badge text-bg-warning">
                Missing
            </span>
        {% endif %}
    </div>

    <p class="text-muted mb-0">
        {% if draft.summary %}
            {{ draft.summary }}
        {% else %}
            No summary was generated.
        {% endif %}
    </p>

</section>
