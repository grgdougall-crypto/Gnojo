<section class="border rounded p-4 mb-4">

    <div
        class="d-flex justify-content-between
               align-items-start gap-3 mb-3"
    >
        <div>
            <p
                class="text-uppercase text-muted
                       small fw-bold mb-1"
            >
                Editable Content
            </p>

            <h2 class="h5 mb-0">
                Syntax
            </h2>
        </div>

        {% if draft.syntax %}
            <span class="badge text-bg-success">
                Complete
            </span>
        {% else %}
            <span class="badge text-bg-warning">
                Missing
            </span>
        {% endif %}
    </div>

    <label
        class="visually-hidden"
        for="syntax"
    >
        Syntax
    </label>

    <textarea
        id="syntax"
        name="syntax"
        class="form-control font-monospace"
        rows="3"
    >{{ draft.syntax }}</textarea>

</section>
