<section class="border rounded p-4 mb-4">

    <div
        class="d-flex justify-content-between
               align-items-start gap-3 mb-3"
    >
        <div>
            <p
                class="text-uppercase text-muted
                       small fw-bold mb-1"
            >
                Editable Content
            </p>

            <h2 class="h5 mb-0">
                Examples
            </h2>
        </div>

        <span class="badge text-bg-primary">
            {{ draft.examples | length }}
        </span>
    </div>

    {% if draft.examples %}

        <div class="d-grid gap-3">

            {% for example in draft.examples %}

                <div class="border rounded p-3">

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold"
                            for="exampleCommand{{ loop.index }}"
                        >
                            Command
                        </label>

                        <input
                            class="form-control font-monospace"
                            id="exampleCommand{{ loop.index }}"
                            name="example_command_{{ loop.index }}"
                            type="text"
                            value="{{ example.command }}"
                        >

                    </div>

                    <div>

                        <label
                            class="form-label fw-semibold"
                            for="exampleDescription{{ loop.index }}"
                        >
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="exampleDescription{{ loop.index }}"
                            name="example_description_{{ loop.index }}"
                            rows="3"
                        >{{ example.description }}</textarea>

                    </div>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <p class="text-muted mb-0">
            No examples were generated.
        </p>

    {% endif %}

</section>
