<div class="col-lg-3">

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <h2 class="h5 mb-4">
                Workflow Summary
            </h2>

            <div class="row g-3">

                <div class="col-6">

                    <div class="border rounded p-3 h-100">

                        <p class="small text-uppercase text-muted mb-1">
                            Total Nodes
                        </p>

                        <p class="h4 mb-0">
                            {{ statistics.total_nodes }}
                        </p>

                    </div>

                </div>

                <div class="col-6">

                    <div class="border rounded p-3 h-100">

                        <p class="small text-uppercase text-muted mb-1">
                            Questions
                        </p>

                        <p class="h4 mb-0">
                            {{ statistics.questions }}
                        </p>

                    </div>

                </div>

                <div class="col-6">

                    <div class="border rounded p-3 h-100">

                        <p class="small text-uppercase text-muted mb-1">
                            Instructions
                        </p>

                        <p class="h4 mb-0">
                            {{ statistics.instructions }}
                        </p>

                    </div>

                </div>

                <div class="col-6">

                    <div class="border rounded p-3 h-100">

                        <p class="small text-uppercase text-muted mb-1">
                            Resolutions
                        </p>

                        <p class="h4 mb-0">
                            {{ statistics.resolutions }}
                        </p>

                    </div>

                </div>

            </div>

            <hr class="my-4">

            <dl class="mb-0">

                <dt class="mb-1">
                    Estimated Steps
                </dt>

                <dd class="text-muted mb-3">
                    {{ workflow.estimated_steps }}
                </dd>

                <dt class="mb-1">
                    Start Node
                </dt>

                <dd class="text-muted mb-0">
                    {{ statistics.start_node_title }}
                </dd>

            </dl>

        </div>

    </div>

</div>
