<header class="workflow-header">
    <div class="workflow-header__identity">
        <a class="workflow-header__back" href="{{ return_to or url_for('workflow_studio') }}" aria-label="{{ return_label }}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
        </a>
        <div class="workflow-header__copy">
            <div class="workflow-header__eyebrow">Workflow Designer</div>
            <div class="workflow-header__title-row">
                <h1 id="workflow-title">{{ workflow.name }}</h1>
                <button id="versionHistoryButton" class="workflow-status{% if lifecycle_projection.lifecycle_state == 'MATCHES_PUBLISHED' %} workflow-status--published{% elif lifecycle_projection.lifecycle_state == 'AMBIGUOUS_STATE' %} workflow-status--ambiguous{% else %} workflow-status--changed{% endif %}" type="button">{{ lifecycle_view.header_label }}</button>
            </div>
            <p>Build and review the support path your team will follow.</p>
        </div>
    </div>

    <div class="workflow-header__actions" aria-label="Workflow actions">
        <button id="simulateWorkflowButton" class="btn btn-sm btn-outline-primary" type="button">
            <i class="bi bi-play-circle" aria-hidden="true"></i>
            <span>Simulate</span>
        </button>
        <button id="exportWorkflowButton" class="btn btn-sm btn-outline-secondary" type="button">
            <i class="bi bi-download" aria-hidden="true"></i>
            <span>Export</span>
        </button>
        <button id="publishWorkflowButton" class="btn btn-sm btn-primary" type="button" disabled title="Validate the workflow before publishing">
            <i class="bi bi-send" aria-hidden="true"></i>
            <span>Publish</span>
        </button>
    </div>
</header>
