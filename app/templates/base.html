<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Gnojo{% endblock %}</title>

    <link rel="icon" href="{{ url_for('static', filename='brand/gnojo-app-icon.svg') }}" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <div id="a11yStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <header class="app-header">
        <nav class="navbar" aria-label="Primary navigation">
            <div class="container">

                <a
                    class="navbar-brand d-flex align-items-center gap-2"
                    href="/"
                >
                    <span class="brand-icon">
                        <img src="{{ url_for('static', filename='brand/gnojo-mark-reverse.svg') }}" alt="">
                    </span>

                    <span>Gnojo</span>
                </a>

                <div class="global-search-wrapper">

                    <form
                        class="global-search"
                        id="globalSearchForm"
                        method="GET"
                        action="{{ url_for('search') }}"
                        role="search"
                        autocomplete="off"
                    >
                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>

                            <input
                                class="form-control"
                                id="globalSearchInput"
                                type="search"
                                name="q"
                                placeholder="Search Gnojo..."
                                value="{{ request.args.get('q', '') }}"
                                aria-label="Search Gnojo"
                                aria-autocomplete="list"
                                aria-controls="searchSuggestions"
                                aria-expanded="false"
                            >

                            <input
                                type="hidden"
                                name="type"
                                value="all"
                            >

                            <button
                                class="btn btn-primary"
                                type="submit"
                            >
                                Search
                            </button>

                        </div>
                    </form>

                    <div
                        class="search-suggestions"
                        id="searchSuggestions"
                        role="listbox"
                        hidden
                    ></div>

                </div>

                <div class="header-actions">

                    <span class="header-status">
                        <span class="status-dot"></span>
                        Gnojo ready
                    </span>

                    <a
                        class="btn btn-outline-secondary btn-sm header-history-link"
                        href="{{ url_for('troubleshooting_history') }}"
                        {% if request.endpoint in ('troubleshooting_history', 'troubleshooting_history_detail') %}aria-current="page"{% endif %}
                    >
                        <i class="bi bi-clock-history" aria-hidden="true"></i>
                        <span>History</span>
                    </a>

                    <a
    class="btn btn-outline-primary btn-sm"
    href="{{ url_for('content_studio') }}"
    {% if request.endpoint == 'content_studio' %}aria-current="page"{% endif %}
>
    <i class="bi bi-pencil-square me-1"></i>
    Content Studio
</a>

                    <button
                        class="theme-toggle"
                        id="themeToggle"
                        type="button"
                        aria-label="Switch color theme"
                    >
                        <i class="bi bi-sun"></i>
                    </button>

                </div>

            </div>
        </nav>
    </header>

    <main id="mainContent" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer" aria-label="Gnojo footer">
        <div class="container">
            <p class="mb-0">
                Gnojo · Navigate. Diagnose. Resolve.
            </p>
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
    <script src="{{ url_for('static', filename='js/session_protection.js') }}"></script>
    <script src="{{ url_for('static', filename='js/accessibility.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
