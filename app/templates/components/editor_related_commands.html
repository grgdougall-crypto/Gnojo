<section class="border rounded p-4 mb-4">

    <div
        class="d-flex justify-content-between
               align-items-start gap-3 mb-3"
    >
        <div>
            <p
                class="text-uppercase text-muted
                       small fw-bold mb-1"
            >
                Editable Content
            </p>

            <h2 class="h5 mb-0">
                Related Commands
            </h2>
        </div>

        <span class="badge text-bg-primary">
            {{ draft.related_commands | length }}
        </span>
    </div>

    {% if draft.related_commands %}

        <div class="d-grid gap-3">

            {% for command in draft.related_commands %}

                <div>

                    <label
                        class="form-label fw-semibold"
                        for="relatedCommand{{ loop.index }}"
                    >
                        Command {{ loop.index }}
                    </label>

                    <input
                        class="form-control font-monospace"
                        id="relatedCommand{{ loop.index }}"
                        name="related_command_{{ loop.index }}"
                        type="text"
                        value="{{ command }}"
                    >

                </div>

            {% endfor %}

        </div>

    {% else %}

        <p class="text-muted mb-0">
            No related commands were generated.
        </p>

    {% endif %}

</section>
