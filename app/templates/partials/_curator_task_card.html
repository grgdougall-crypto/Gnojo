<a class="curator-task curator-task--{{ task.classification|lower }}" href="{{ url_for('curator_task_detail', task_id=task.task_id) }}">
  <div class="curator-task__meta"><span class="badge text-bg-secondary">{{ task.classification }}</span><span>{{ task.priority }}</span><span>{{ task.status|replace('_', ' ')|title }}</span><span>{{ task.execution_mode|replace('_', ' ')|title }}</span></div>
  <h4>{{ task.title }}</h4>
  <p>{{ task.recommended_action }}</p>
  <div class="curator-task__footer"><code>{{ task.task_id }}</code><span>{{ task.owner }}</span><span>Debt {{ task.knowledge_debt_score }}</span><span>Seen {{ task.times_observed }}&times;</span></div>
</a>
